name: Sync Fork with Upstream

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-fork:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          UPSTREAM_REPO=$(gh repo view "$REPO" --json parent --jq '.parent.nameWithOwner')
          gh repo sync "$REPO" --source "$UPSTREAM_REPO" --branch "$DEFAULT_BRANCH"